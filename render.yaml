# Blueprint do Render. Permite subir o projeto sem configurar nada na interface:
# New > Blueprint > aponta para este repositorio.
#
# ATENCAO: "name" define a URL publica (https://<name>.onrender.com) e precisa ser unico
# em todo o Render. Se o nome ja estiver em uso, troque aqui e tambem em APP_URL_BASE.
services:
  - type: web
    name: send-hemosc
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo

      - key: APP_URL_BASE
        # Monta o link de descadastro nos e-mails. Ajuste junto se trocar o nome do servico.
        value: https://send-hemosc.onrender.com

      # --- Envio de e-mail ---
      # Padrao log: nada e enviado. Para testar envio real, preencha as chaves abaixo pelo
      # painel do Render. Elas usam sync: false, ou seja, o valor e pedido na interface e NAO
      # fica versionado aqui — senha nenhuma entra no repositorio.
      #
      # Com EMAIL_MODO=smtp o servico so sobe se EMAIL_DESTINATARIO_TESTE estiver preenchido:
      # a demonstracao e publica e nao pode disparar para a massa ficticia.
      - key: EMAIL_MODO
        value: log

      - key: EMAIL_DESTINATARIO_TESTE
        sync: false

      - key: MAIL_HOST
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_USER
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_REMETENTE
        sync: false
