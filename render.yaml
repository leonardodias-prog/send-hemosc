# Blueprint do Render. Permite subir o projeto sem configurar nada na interface:
# New > Blueprint > aponta para este repositorio.
#
# ATENCAO: "name" define a URL publica (https://<name>.onrender.com) e precisa ser unico
# em todo o Render. Se o nome ja estiver em uso, troque aqui e tambem em APP_URL_BASE.
services:
  - type: web
    name: send-hemosc
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo

      - key: APP_URL_BASE
        # Monta o link de descadastro nos e-mails. Ajuste junto se trocar o nome do servico.
        value: https://send-hemosc.onrender.com

      # --- Envio de e-mail ---
      # Padrao log: nada e enviado. Para ligar o envio real use EMAIL_MODO=resend.
      #
      # NAO use smtp aqui: o Render bloqueia a porta de saida do SMTP para conter spam, e o
      # envio falha com tempo limite de conexao. O Resend entrega por HTTPS na porta 443.
      #
      # Com um modo de envio real, o servico so sobe se EMAIL_DESTINATARIO_TESTE estiver
      # preenchido: a demonstracao e publica e nao pode disparar para a massa ficticia.
      #
      # As chaves com sync: false tem o valor pedido na interface do Render e NAO ficam
      # versionadas aqui — credencial nenhuma entra no repositorio.
      - key: EMAIL_MODO
        value: log

      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_DESTINATARIO_TESTE
        sync: false

      - key: MAIL_HOST
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_USER
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_REMETENTE
        sync: false
