# Blueprint do Render. Permite subir o projeto sem configurar nada na interface:
# New > Blueprint > aponta para este repositorio.
#
# ATENCAO: "name" define a URL publica (https://<name>.onrender.com) e precisa ser unico
# em todo o Render. Se o nome ja estiver em uso, troque aqui e tambem em APP_URL_BASE.
services:
  - type: web
    name: send-hemosc
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: APP_URL_BASE
        # Usado apenas para montar o link de descadastro nos e-mails. No perfil demo o envio
        # fica em modo log, entao um valor divergente nao causa efeito pratico.
        value: https://send-hemosc.onrender.com
