# Perfil com PostgreSQL. Exige o banco no ar (docker compose up -d).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sendhemosc}
    username: ${DB_USER:sendhemosc}
    password: ${DB_PASSWORD:sendhemosc}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Mailtrap / MailHog: caixa de entrada falsa, nada sai para a internet.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

sendhemosc:
  email:
    modo: ${EMAIL_MODO:smtp}
  seed:
    habilitado: ${SEED_HABILITADO:false}
    quantidade-doadores: 120
