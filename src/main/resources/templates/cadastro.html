<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Criar conta — Send Hemosc</title>
    <link rel="stylesheet" th:href="@{/css/sendhemosc.css}"/>
</head>
<body>
<div class="container estreito">

    <header>
        <h1>Criar conta</h1>
        <p class="subtitulo">Acesso para funcionários da unidade</p>
    </header>

    <div class="cartao">
        <form th:action="@{/cadastro}" th:object="${novoUsuario}" method="post">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}" autocomplete="name"/>
                <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="email"/>
                <span class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="campo">
                <label for="perfil">Perfil</label>
                <select id="perfil" th:field="*{perfil}">
                    <option value="">Selecione</option>
                    <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}">Operador</option>
                </select>
                <span class="erro" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></span>
                <p class="dica" th:each="p : ${perfis}">
                    <strong th:text="${p.descricao}">Operador</strong>:
                    <span th:text="${p.atribuicoes}">descrição</span>
                    <span th:if="${p.exigeAprovacao()}">&mdash; depende de aprovação de um administrador.</span>
                </p>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}" autocomplete="new-password"/>
                <span class="erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
            </div>

            <div class="campo">
                <label for="confirmacaoSenha">Repita a senha</label>
                <input type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}"
                       autocomplete="new-password"/>
                <span class="erro" th:if="${#fields.hasErrors('confirmacaoSenha')}"
                      th:errors="*{confirmacaoSenha}"></span>
            </div>

            <button type="submit" class="largo">Criar conta</button>
        </form>
    </div>

    <div class="faixa">
        Ao criar a conta você concorda com o <a th:href="@{/termo}">termo de uso e privacidade</a>.
        Este é um protótipo acadêmico: não cadastre dados de doadores reais.
    </div>

    <footer>
        <p><a th:href="@{/login}">Voltar para a tela de entrada</a></p>
    </footer>

</div>
</body>
</html>
