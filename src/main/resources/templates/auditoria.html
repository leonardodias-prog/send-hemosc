<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Auditoria — Send Hemosc</title>
    <script th:src="@{/js/tema.js}"></script>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/sendhemosc.css}"/>
    <script th:src="@{/js/sendhemosc.js}" defer></script>
</head>
<body>
<div class="app">

<nav th:replace="~{fragmentos/casca :: lateral('auditoria')}"></nav>

<main class="conteudo">
<div class="container">

    <header class="cabecalho">
        <div>
            <h1>Auditoria</h1>
        </div>
    </header>

    <!--/* Categoria se aplica ao clicar; o texto espera o botão. */-->
    <form class="cartao filtros" th:action="@{/auditoria}" method="get" data-filtro-automatico>
        <div class="linha-busca">
            <input type="search" name="busca" th:value="${busca}" aria-label="Buscar por pessoa, e-mail ou detalhe"
                   placeholder="Buscar por pessoa, e-mail ou detalhe"/>
            <button type="submit">Buscar</button>
            <a class="botao secundario" th:if="${categoria != '' or (busca != null and busca != '')}"
               th:href="@{/auditoria}">Limpar filtros</a>
        </div>
        <div class="chips" role="radiogroup" aria-label="Categoria">
            <label class="chip">
                <input type="radio" name="categoria" value="" th:checked="${categoria == ''}"/>
                <span>Tudo</span>
            </label>
            <label class="chip" th:each="c : ${categorias}">
                <input type="radio" name="categoria" th:value="${c.chave}" th:checked="${categoria == c.chave}"/>
                <span th:text="${c.nome}">Convocações</span>
            </label>
        </div>
    </form>

    <div class="cartao vazio-cartao" th:if="${#lists.isEmpty(dias)}">
        <p>Nenhuma ação registrada com esses filtros. Tente outra categoria ou limpe a busca.</p>
    </div>

    <section class="cartao linha-do-tempo" th:unless="${#lists.isEmpty(dias)}">
        <th:block th:each="dia : ${dias}">
            <h2 class="dia" th:text="${dia.rotulo}">Hoje</h2>
            <ol class="eventos">
                <li class="evento" th:each="l : ${dia.linhas}" th:classappend="${l.categoria}">
                    <span class="marcador" aria-hidden="true" th:switch="${l.categoria}">
                        <svg th:case="'convocacoes'" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                        <svg th:case="'envio'" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
                        <svg th:case="'doadores'" viewBox="0 0 24 24"><path d="M12 3c-.6 0-5.5 6.2-5.5 10.5a5.5 5.5 0 0 0 11 0C17.5 9.2 12.6 3 12 3Z"/></svg>
                        <svg th:case="'contas'" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
                        <svg th:case="'seguranca'" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.6 3.4 8.4 8 9 4.6-.6 8-4.4 8-9V6Z"/><path d="M12 9v4"/><path d="M12 16.5v.01"/></svg>
                        <svg th:case="*" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
                    </span>
                    <div class="evento-texto">
                        <div class="evento-titulo">
                            <strong th:text="${l.nome}">Envio de e-mail ligado</strong>
                            <span class="evento-hora" th:text="${#temporals.format(l.registro.ocorridoEm, 'HH:mm')}">19:09</span>
                        </div>
                        <p class="evento-detalhe" th:text="${l.registro.detalhe}">detalhe</p>
                        <p class="evento-autor">
                            <span th:if="${l.registro.autor != null and l.registro.autor != 'sistema'}"
                                  th:text="'por ' + ${l.registro.autor}">por admin@sendhemosc.local</span>
                            <span th:unless="${l.registro.autor != null and l.registro.autor != 'sistema'}">pelo sistema</span>
                        </p>
                    </div>
                </li>
            </ol>
        </th:block>

        <nav th:replace="~{fragmentos/paginacao :: paginacao(${registros}, ${urlPaginacao})}"></nav>
    </section>


</div>
</main>

</div>
</body>
</html>
