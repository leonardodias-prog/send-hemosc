spring:
  application:
    name: send-hemosc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

  messages:
    basename: messages
    encoding: UTF-8


server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      # Somente cookie: evita que o Spring reescreva a URL com ;jsessionid quando ainda nao
      # existe cookie, o que quebrava o redirect do painel e expunha o id da sessao na URL.
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # Desligado de proposito. O indicador padrao abre uma conexao SMTP autenticada a cada
      # verificacao de saude, o que traz tres problemas em producao:
      #   1. a saude da aplicacao passaria a depender do servidor de e-mail estar no ar, e uma
      #      instabilidade do provedor faria a plataforma reiniciar um servico que esta bom;
      #   2. cada checagem custa ate 10 segundos, acima do tempo limite de varias plataformas;
      #   3. autenticar repetidamente contra o provedor desperdica conexao e pode disparar
      #      alerta de seguranca na conta.
      # O envio propriamente dito continua tendo o seu proprio tratamento de falha.
      enabled: false

# ---------------------------------------------------------------------------
# Regras de negócio do domínio.
#
# ATENCAO: os valores abaixo reproduzem a normativa vigente de hemoterapia,
# mas PRECISAM SER VALIDADOS FORMALMENTE pela equipe do HEMOSC antes de
# qualquer uso que não seja demonstração. Informação errada aqui gera dano real.
# ---------------------------------------------------------------------------
sendhemosc:
  seguranca:
    master:
      # Administrador criado na primeira subida, quando ainda nao existe nenhum.
      # Sem MASTER_SENHA, uma senha aleatoria e gerada e escrita no log da subida.
      email: ${MASTER_EMAIL:admin@sendhemosc.local}
      nome: ${MASTER_NOME:Administrador}
      senha: ${MASTER_SENHA:}

  termo:
    # Versao registrada junto do consentimento de cada doador. Mudou o texto, muda a versao.
    versao: ${TERMO_VERSAO:1.0}

  aptidao:
    intervalo-dias-masculino: 60
    intervalo-dias-feminino: 90
    max-doacoes-ano-masculino: 4
    max-doacoes-ano-feminino: 3
    idade-minima: 16
    idade-maxima: 69
    peso-minimo-kg: 50
  estoque:
    # Percentual da capacidade alvo que separa cada nível
    limiar-critico-percentual: 30
    limiar-atencao-percentual: 60
  email:
    # log   = apenas registra a mensagem no console. Padrão: nada sai da máquina.
    # brevo = entrega pela API HTTP do Brevo, na porta 443. Hospedagens gratuitas bloqueiam
    #         a porta de saída do SMTP para conter spam, então entrega por HTTP é o caminho.
    modo: ${EMAIL_MODO:log}
    # Quando preenchido, TODA mensagem vai para estes endereços, seja qual for o doador.
    # Aceita vários separados por vírgula. Existe para que um teste de envio real não
    # atinja a massa fictícia inteira.
    destinatario-teste: ${EMAIL_DESTINATARIO_TESTE:}
    # Interrompe a rodada depois desta quantidade de falhas seguidas
    max-falhas-consecutivas: ${EMAIL_MAX_FALHAS:5}
    # Estado do interruptor na subida. O responsável liga e desliga pela tela; o valor volta
    # para este a cada reinício, de propósito: desligar por incidente não deve ficar esquecido.
    ativo-na-subida: ${EMAIL_ATIVO:true}
    brevo:
      api-key: ${BREVO_API_KEY:}

  disparo-automatico:
    # De quanto em quanto tempo o agendador confere se a rodada automática é devida. Se há
    # rodada, para quais tipos e em que horário é decisão da tela /disparo-automatico, que
    # nasce desligada.
    verificacao-ms: 600000
    # Primeira conferência depois da subida. Na hospedagem gratuita o serviço acorda quando
    # alguém o acessa; conferir logo em seguida aproveita esse momento.
    primeira-verificacao-ms: 60000

  notificacao:
    # Limites de contato por pessoa. Valem para toda convocação, manual ou automática: para
    # quem recebe, o e-mail é o mesmo, seja qual for o botão que o disparou.
    #   intervalo-reenvio-dias: dias mínimos entre uma convocação e a seguinte para a mesma pessoa
    #   max-convocacoes-sem-resposta: a partir de quantas convocações ignoradas a pessoa deixa de
    #     ser chamada. Registrar uma doação dela fecha as pendentes e zera a contagem.
    #   prazo-teto-dias: por quantos dias uma convocação sem resposta conta para o teto. Depois
    #     deixa de pesar, e a pessoa volta a poder ser chamada. O administrador também pode
    #     liberar uma pessoa na hora, pela tela de doadores.
    intervalo-reenvio-dias: 30
    max-convocacoes-sem-resposta: 3
    prazo-teto-dias: 180
    # Precisa ser um remetente verificado no Brevo. Sem domínio próprio, verifica-se um
    # endereço avulso; com domínio, qualquer caixa dele.
    remetente: ${MAIL_REMETENTE:nao-responda@sendhemosc.local}
    remetente-nome: Send Hemosc (PROTOTIPO)
    url-base: ${APP_URL_BASE:http://localhost:8080}
