spring:
  application:
    name: send-hemosc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

  messages:
    basename: messages
    encoding: UTF-8

  # Servidor de saida. So e usado quando sendhemosc.email.modo = smtp.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      # Somente cookie: evita que o Spring reescreva a URL com ;jsessionid quando ainda nao
      # existe cookie, o que quebrava o redirect do painel e expunha o id da sessao na URL.
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ---------------------------------------------------------------------------
# Regras de negócio do domínio.
#
# ATENCAO: os valores abaixo reproduzem a normativa vigente de hemoterapia,
# mas PRECISAM SER VALIDADOS FORMALMENTE pela equipe do HEMOSC antes de
# qualquer uso que não seja demonstração. Informação errada aqui gera dano real.
# ---------------------------------------------------------------------------
sendhemosc:
  aptidao:
    intervalo-dias-masculino: 60
    intervalo-dias-feminino: 90
    max-doacoes-ano-masculino: 4
    max-doacoes-ano-feminino: 3
    idade-minima: 16
    idade-maxima: 69
    peso-minimo-kg: 50
  estoque:
    # Percentual da capacidade alvo que separa cada nível
    limiar-critico-percentual: 30
    limiar-atencao-percentual: 60
  email:
    # log  = apenas registra a mensagem no console. Padrão: nada sai da máquina.
    # smtp = envia de verdade pelo servidor configurado em spring.mail.
    modo: ${EMAIL_MODO:log}
    # Quando preenchido, TODA mensagem vai para este endereço, seja qual for o doador.
    # Existe para que um teste de envio real não atinja a massa fictícia inteira.
    destinatario-teste: ${EMAIL_DESTINATARIO_TESTE:}

  notificacao:
    # Reenvio para quem não compareceu, enquanto o tipo seguir em nível baixo
    intervalo-reenvio-dias: 30
    # No Gmail o remetente precisa ser a própria conta autenticada.
    remetente: ${MAIL_REMETENTE:nao-responda@sendhemosc.local}
    remetente-nome: Send Hemosc (PROTOTIPO)
    url-base: ${APP_URL_BASE:http://localhost:8080}
