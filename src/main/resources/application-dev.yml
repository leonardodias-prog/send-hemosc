# Perfil de desenvolvimento: roda sem Docker, sem banco externo e sem enviar e-mail.
# Basta `mvn spring-boot:run`.
spring:
  datasource:
    url: jdbc:h2:mem:sendhemosc;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration

sendhemosc:
  # O modo de e-mail vem de application.yml e respeita a variavel EMAIL_MODO,
  # para que seja possivel testar o envio real sem subir Postgres nem Docker.
  seed:
    # Popula o banco com doadores e estoque fictícios na subida
    habilitado: true
    quantidade-doadores: 120

  scheduler:
    # Desligado em desenvolvimento: o disparo automatico so faz sentido em ambiente real.
    cron-convocacao: ${CRON_CONVOCACAO:-}

logging:
  level:
    br.univille.sendhemosc: DEBUG
    org.hibernate.SQL: DEBUG
