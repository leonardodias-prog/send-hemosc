# Perfil de desenvolvimento: roda sem Docker, sem banco externo e sem enviar e-mail.
# Basta `mvn spring-boot:run`.
spring:
  datasource:
    url: jdbc:h2:mem:sendhemosc;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration

sendhemosc:
  email:
    # log  = apenas registra o e-mail no console (padrão seguro, não sai nada)
    # smtp = envia de verdade pelo SMTP configurado
    modo: log
  seed:
    # Popula o banco com doadores e estoque fictícios na subida
    habilitado: true
    quantidade-doadores: 120

logging:
  level:
    br.univille.sendhemosc: DEBUG
    org.hibernate.SQL: DEBUG
