# Mensagens da aplicacao.
#
# Este e o bundle BASE, sem sufixo de locale, e isso e proposital: o Spring Boot so registra
# o bean MessageSource quando encontra messages.properties. Com apenas messages_pt_BR.properties
# o bean nao e criado e toda mensagem cai no fallback, devolvendo a chave crua tanto na API
# quanto na validacao dos formularios. A aplicacao atende somente pt-BR, entao um bundle basta.
#
# O arquivo e lido como UTF-8 (spring.messages.encoding), entao acentos podem ser escritos
# diretamente.

