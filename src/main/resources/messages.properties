# Mensagens da aplicacao.
#
# Este e o bundle BASE, sem sufixo de locale, e isso e proposital: o Spring Boot so registra
# o bean MessageSource quando encontra messages.properties. Com apenas messages_pt_BR.properties
# o bean nao e criado e toda mensagem cai no fallback, devolvendo a chave crua tanto na API
# quanto na validacao dos formularios. A aplicacao atende somente pt-BR, entao um bundle basta.
#
# O arquivo e lido como UTF-8 (spring.messages.encoding), entao acentos podem ser escritos
# diretamente.

# --- Doador ---
doador.nome.obrigatorio=O nome do doador é obrigatório.
doador.email.obrigatorio=O e-mail do doador é obrigatório.
doador.email.invalido=Informe um e-mail válido.
doador.email.duplicado=Já existe um doador cadastrado com este e-mail.
doador.tipo-sanguineo.obrigatorio=Selecione o tipo sanguíneo.
doador.sexo.obrigatorio=Selecione o sexo do doador.
doador.data-nascimento.obrigatoria=A data de nascimento é obrigatória.
doador.data-nascimento.invalida=A data de nascimento deve ser anterior a hoje.
doador.nao-encontrado=Doador não encontrado.
doador.cadastrado=Doador cadastrado com sucesso.

# --- Aptidão para doação ---
doador.inapto.idade=Doador fora da faixa etária permitida para doação.
doador.inapto.peso=Doador abaixo do peso mínimo para doação.
doador.inapto.intervalo=Doador ainda não cumpriu o intervalo mínimo desde a última doação.
doador.inapto.limite-anual=Doador atingiu o limite de doações no período de 12 meses.

# --- Estoque ---
estoque.nao-encontrado=Não há registro de estoque para o tipo sanguíneo informado.
estoque.quantidade.negativa=A quantidade em estoque não pode ser negativa.
estoque.capacidade.invalida=A capacidade alvo deve ser maior que zero.

# --- Notificação ---
notificacao.sem-destinatarios=Nenhum doador apto encontrado para o tipo sanguíneo informado.
notificacao.falha-envio=Falha ao enviar a notificação por e-mail.
