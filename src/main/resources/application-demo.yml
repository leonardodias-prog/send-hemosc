# Perfil de demonstracao publica.
#
# Roda sem banco externo e sem servidor de e-mail: H2 em memoria, massa ficticia gerada na
# subida e envio apenas em log. O estado volta ao inicial a cada reinicio, o que e proposital
# para uma demonstracao: quem abrir o link sempre encontra o mesmo cenario.
spring:
  datasource:
    url: jdbc:h2:mem:sendhemosc;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: false
  thymeleaf:
    cache: true

sendhemosc:
  email:
    # Padrao: nao envia nada. Para ligar o envio real nesta demonstracao publica e
    # obrigatorio definir tambem destinatario-teste; EnvioSeguroDemoValidator recusa
    # subir na combinacao smtp sem destinatario unico.
    modo: ${EMAIL_MODO:log}
    destinatario-teste: ${EMAIL_DESTINATARIO_TESTE:}
  seed:
    habilitado: true
    quantidade-doadores: 120
  notificacao:
    url-base: ${APP_URL_BASE:http://localhost:8080}
  scheduler:
    # Desliga a varredura automatica: numa demo publica o disparo e sempre manual.
    cron-convocacao: "-"

logging:
  level:
    root: WARN
    br.univille.sendhemosc: INFO
